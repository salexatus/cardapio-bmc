; ===== Supervisor — Gunicorn do backend BMC =====
; Instalar como ROOT em /etc/supervisor/conf.d/apicardapiobmc-gunicorn.conf na VPS:
;   sudo cp <este arquivo> /etc/supervisor/conf.d/apicardapiobmc-gunicorn.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status apicardapiobmc-gunicorn
; (o usuário de deploy claude-conect-bmc NÃO tem root — só clpctlWrapper)

[program:apicardapiobmc-gunicorn]
command=/home/limadesigner-apicardapiobmc/htdocs/apicardapiobmc.limadesigner.com.br/backend/.venv/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8050 --workers 3 --timeout 60 --access-logfile /home/limadesigner-apicardapiobmc/logs/gunicorn-access.log --error-logfile /home/limadesigner-apicardapiobmc/logs/gunicorn-error.log
directory=/home/limadesigner-apicardapiobmc/htdocs/apicardapiobmc.limadesigner.com.br/backend
user=limadesigner-apicardapiobmc
autostart=true
autorestart=true
redirect_stderr=true
stopasgroup=true
killasgroup=true
environment=DJANGO_SETTINGS_MODULE="config.settings"
